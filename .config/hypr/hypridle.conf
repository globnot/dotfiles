general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # fprintd-list réveille fprintd (voir hyprland.lua pour le même appel au
    # démarrage de session) : après une vraie reprise de suspend (clapet
    # fermé...), le capteur USB est physiquement redémarré et fprintd garde
    # une référence obsolète vers l'ancien, causant des erreurs "already
    # claimed"/"device was disconnected" tant qu'il ne le redétecte pas.
    after_sleep_cmd = hyprctl dispatch dpms on && fprintd-list "$USER" >/dev/null 2>&1
}

# Verrouille après 5 min d'inactivité
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Éteint l'écran après 5.5 min (économie d'énergie, réveil au premier mouvement/touche)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend après 10 min
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
